name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: yezz123/setup-uv@v4
      - run: bun install
      - run: cd forge && uv sync && cd ..
      - run: bun run release:check
