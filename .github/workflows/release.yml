name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write # required for npm Trusted Publishing (OIDC)
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs Node ≥ 22.14 and a recent npm CLI
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: uv sync --locked --project studios/cad/forge
      - run: bun install --frozen-lockfile
      - run: bun run test:browser:install
      - run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=$(node -p "require('./package.json').version")
          test "$TAG" = "v$VERSION"
      - run: bun run release:check
      # OIDC only — do not set NODE_AUTH_TOKEN (legacy token path blocks trusted publish).
      # Configure Trusted Publisher on npmjs.com for this package first:
      #   Organization/user: oguzkaganozt
      #   Repository: opencode-studio
      #   Workflow filename: release.yml
      #   Environment name: npm
      - run: npm publish --access public --provenance
