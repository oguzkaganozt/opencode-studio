[project]
name = "forge-cad"
version = "0.1.0"
description = "Deterministic build of parametric CAD designs"
requires-python = ">=3.12"
dependencies = [
  "build123d==0.11.1",
  "trimesh==4.12.2",
]

[project.scripts]
forge = "forge_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["forge_cli.py"]
