[project]
name = "forge-cad"
version = "0.2.0"
description = "OpenCode Studio CAD: deterministic forge build + owned build123d session runtime"
requires-python = ">=3.12"
dependencies = [
  "build123d==0.11.1",
  "trimesh==4.12.2",
  # Owned session runtime (vendored from build123d-mcp 0.3.80, Apache-2.0)
  "augura>=0.1.6",
  "bd-warehouse",
  "build123d-drafting-helpers>=0.10.0",
  "defusedxml>=0.7.1",
  "mcp>=1.9,<2",
  "resvg-py",
  "scipy",
  "vtk>=9.3",
]

[project.scripts]
forge = "forge_cli:main"
studio-cad-runtime = "cad_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cad_runtime"]
include = ["forge_cli.py"]
